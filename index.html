<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Sales Dashboard</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Customer Sales Dashboard</h1>
      <span class="fy" id="fy">FY 2026-27</span>
    </div>
    <div class="controls">
      <label for="month">Month</label>
      <select id="month"></select>
    </div>
  </header>

  <main>
    <p class="note">Sales = Taxable Amount &nbsp;•&nbsp; YTD = April to selected month &nbsp;•&nbsp; LY = same period last year
      <span id="source" class="source"></span></p>

    <section class="kpis" id="kpis"></section>

    <nav class="tabs" id="tabs">
      <button data-tab="all" class="active">One View</button>
      <button data-tab="1">Month-wise</button>
      <button data-tab="2">CY VS LY SALE</button>
      <button data-tab="3">YTD MONTH</button>
      <button data-tab="4">YTD year</button>
      <button data-tab="5">current month target</button>
    </nav>

    <div class="tables" id="tables" data-view="all">
    <section class="block" data-tab="1">
      <h2 id="t1">Month-wise</h2>
      <div class="tbl-wrap"><table id="tbl1"></table></div>
    </section>

    <section class="block" data-tab="2">
      <h2 id="t2">CY VS LY SALE</h2>
      <div class="tbl-wrap"><table id="tbl2"></table></div>
    </section>

    <section class="block" data-tab="3">
      <h2 id="t3">YTD MONTH</h2>
      <div class="tbl-wrap"><table id="tbl3"></table></div>
    </section>

    <section class="block" data-tab="4">
      <h2 id="t4">YTD year</h2>
      <div class="tbl-wrap"><table id="tbl4"></table></div>
    </section>

    <section class="block" data-tab="5">
      <h2 id="t5">current month target</h2>
      <div class="tbl-wrap"><table id="tbl5"></table></div>
    </section>
    </div>
  </main>

  <div id="loading" class="loading">Loading data…</div>

  <script src="data.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
